<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header Section -->
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" class="logo" alt="Netflix Logo"/>
    <nav class="navbar">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Catalog</a></li>
        <li><a href="#">Profile</a></li>
        <li><a href="#">Sign In</a></li>
      </ul>
    </nav>
    <div class="search-bar">
      <input type="text" placeholder="Search..." />
      <button>🔍</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>Popular on Netflix</h1>
      <p>Watch unlimited movies and TV shows.</p>
      <div class="hero-buttons">
        <button>▶ Play</button>
        <button>＋ My List</button>
      </div>
    </div>
  </section>

  <!-- Movie Categories -->
  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img src="https://image.tmdb.org/t/p/w300/6MKr3KgOLmzOP6MSuZERO41Lpkt.jpg" class="poster" alt="Movie 1">
      <img src="https://image.tmdb.org/t/p/w300/4W0FnjSGn4x0mKZlBRx8OjFxQUM.jpg" class="poster" alt="Movie 2">
      <img src="https://image.tmdb.org/t/p/w300/qAZ0pzat24kLdO3o8ejmbLxyOac.jpg" class="poster" alt="Movie 3">
    </div>
  </section>

  <section class="row">
    <h2>Top Rated</h2>
    <div class="row-posters">
      <img src="https://image.tmdb.org/t/p/w300/1BIoJGKbXjdFDAqUEiA2VHqkK1Z.jpg" class="poster" alt="Movie 4">
      <img src="https://image.tmdb.org/t/p/w300/uDgy6hyPd82kOHh6I95FLtLnj6p.jpg" class="poster" alt="Movie 5">
      <img src="https://image.tmdb.org/t/p/w300/d5NXSklXo0qyIYkgV94XAgMIckC.jpg" class="poster" alt="Movie 6">
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
